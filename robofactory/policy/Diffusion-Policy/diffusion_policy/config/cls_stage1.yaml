# CLS-DP Stage 1: train the contextualizer (privileged CVAE).
# One run per agent. Launch with policy/Diffusion-Policy/train_cls_stage1.sh
defaults:
  - _self_
  - task: cls_task

name: cls_stage1
_target_: diffusion_policy.workspace.contextualizer_workspace.ContextualizerWorkspace

task_name: LiftBarrier-rf
agent_id: 0
n_agents: 2
data_num: 150
exp_name: "default"

# Stage 1 never touches images or actions, only cached SigLIP features and states.
stage: 1

checkpoint_name: ${task_name}_ctx_Agent${agent_id}_${data_num}

# Paper Table I
horizon: 8
n_obs_steps: 3
n_future_states: 8
latent_dim: 256
feature_dim: 768
state_dim: 8

contextualizer:
  _target_: diffusion_policy.policy.contextualizer.Contextualizer
  agent_id: ${agent_id}
  n_agents: ${n_agents}
  latent_dim: ${latent_dim}

  prior_net:
    _target_: diffusion_policy.model.cls.prior_net.PriorNet
    feature_dim: ${feature_dim}
    latent_dim: ${latent_dim}
    d_model: 768
    n_layers: 2
    n_heads: 8
    dim_feedforward: 2048
    dropout: 0.0
    n_query: 1

  # Sized against the ~2.3M parameter budget derived from Table III of the paper.
  ma_encoder:
    _target_: diffusion_policy.model.cls.ma_kinematics.MAKinematicsEncoder
    state_dim: ${state_dim}
    n_agents: ${n_agents}
    n_future_states: ${n_future_states}
    latent_dim: ${latent_dim}
    d_model: 256
    n_layers: 2
    n_heads: 4
    dim_feedforward: 512
    dropout: 0.0

  ma_decoder:
    _target_: diffusion_policy.model.cls.ma_kinematics.MAKinematicsDecoder
    state_dim: ${state_dim}
    n_agents: ${n_agents}
    n_future_states: ${n_future_states}
    latent_dim: ${latent_dim}
    d_model: 256
    n_layers: 2
    n_heads: 4
    dim_feedforward: 512
    dropout: 0.0

dataloader:
  batch_size: 512
  num_workers: 0
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 512
  num_workers: 0
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  # Study B: paper Table I / §V-A specify Adam. Study A used AdamW.
  _target_: torch.optim.Adam
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 100
  gradient_accumulate_every: 1
  grad_clip_norm: 1.0
  # KL weight and its linear warm-up fraction (Table I)
  beta: 0.1
  beta_warmup_ratio: 0.4
  val_every: 1
  checkpoint_every: 25
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}_agent${agent_id}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
