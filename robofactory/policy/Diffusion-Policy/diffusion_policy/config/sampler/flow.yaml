# @package _global_
#
# Flow-matching (rectified-flow / conditional-OT) head. Same U-Net, same conditioning, same
# z cross-attention; only the transport between noise and actions changes. 30 model calls
# instead of 100, at a higher success rate -- see num_inference_steps below.
#
# Select with `sampler=flow`. Composes with any latent variant:
#   python train.py --config-name=cls_dp.yaml     sampler=flow    -> clsdpfm
#   python train.py --config-name=cls_dp_det.yaml sampler=flow    -> clsdpdetfm
#
# See docs/CLS-DP-variant-flow-matching.md for the derivation of every knob below.

head_tag: fm

policy:
  _target_: diffusion_policy.policy.cls_flow_matching_unet_image_policy.CLSFlowMatchingUnetImagePolicy

  # There is no DDPM chain here. The parent class accepts null when num_inference_steps is
  # given explicitly, which it always is below.
  noise_scheduler: null

  # Euler steps from sigma=1 (noise) to sigma=0 (data). Sweepable at eval without
  # retraining via eval_multi_cls_dp.py --num-inference-steps.
  #
  # 30, not the 4 this variant was designed around. Measured on LiftBarrier with the
  # uniform-sigma checkpoint, same weights throughout:
  #     steps   4     8     12    24    30
  #     SR      20%   28%   40%   60%   67%
  # Study B's 100-step DDPM gets 61%, so the flow field is fine and in fact better than the
  # baseline -- what failed at 4 steps was ODE discretization, not the fit. 30 is the only
  # measured setting that beats Study B, and it still costs 3.3x fewer model calls.
  #
  # Lower this only with a matching eval number in hand. Note that open-loop action MSE
  # will not tell you: it moves 3% across 4 -> 30 steps while success moves 47 points.
  # Chunk jerk does track it (3.8x the demonstrations at 4 steps, 1.55x at 30).
  #
  # The open work is buying 30-step accuracy at a smaller budget. solver=heun is free and
  # still untested; the beta-sigma retrain was tried and lost (see sigma_dist).
  num_inference_steps: 30

  # euler: 1 model call per step. midpoint: 2 calls, second-order.
  # heun: improved Euler (EDM / k-diffusion); 2 calls except the last step.
  solver: euler

  # Exclude exact 0 during training (inference still terminates at 0). Matches the
  # SD3/Flux/EDM practice of not asking the network to denoise a sample that is already
  # on the data manifold.
  sigma_min: 1.0e-4

  # How sigma is drawn during training. TRAINING-TIME ONLY -- `sample_sigma` is reached
  # from `compute_loss` and from nowhere else, and the sampler's grid comes from
  # `sigma_schedule`, which never consults it. There is no way to change this on an
  # existing checkpoint; a different sigma_dist is a different Stage 2 run.
  #
  # uniform, after Beta was tried and rejected on LiftBarrier. Beta(1.5, 1.0) is what pi0,
  # pi0.5, SmolVLA, GR00T and WALL-X use, and it did exactly what it promises -- 0.84x the
  # velocity error at sigma=0.99 against uniform, crossing over near sigma=0.3 to 1.14x at
  # sigma=0.02. But the terminal region is what resolves fine temporal detail here, so the
  # Beta checkpoint emits chunks 1.9x as jerky as the demonstrations against uniform's
  # 1.55x, and scored 46/100 against uniform's 67/100 at the same 30 steps.
  #
  # The plausible reading is scale: those VLAs train on orders of magnitude more data with
  # far larger backbones, where the extra high-sigma capacity is affordable. At 150
  # episodes and an 8x8 action tensor it is not, and the low-sigma half pays for it.
  #
  # logit_normal (SD3) concentrates on mid-sigma instead and wants sigma_dist_scale at 1.0.
  sigma_dist: uniform
  sigma_dist_loc: 0.0
  sigma_dist_scale: 1.0

  # Bound on the implied clean sample |x1_hat|, applied at every solver step -- the flow
  # analogue of the DDPM head's clip_sample=True, which Study B ran with.
  #
  # Off, because it turned out to be a numerical no-op rather than a fix. Measured over a
  # 30-step trajectory: only 4-5% of x1_hat entries ever leave [-1, 1], and the worst is
  # 1.07, so clamping moves open-loop action MSE in the fifth decimal (0.000366 either
  # way). The 17-point drop once attributed to it does not survive the seed accounting.
  #
  # Unlike sigma_dist this IS an inference-time knob, so it applies to existing checkpoints
  # and can be swept for free. It is dropped automatically under action_space=latent, where
  # the flow runs in an unbounded code space.
  clamp_x1: null

  # SD3/Flux time shift, sigma' = shift*sigma / (1 + (shift-1)*sigma). 1.0 disables it.
  # CLS-DP-improvements.md section 4 argues the optimal shift here is ~0 because the action
  # tensor is only 8x8 = 64 values, so this stays off by default.
  #
  # It is applied in both sample_sigma and sigma_schedule, so with training left at 1.0 it
  # is a pure inference knob and sweepable on existing checkpoints. It is also the one
  # eval-time lever on a Beta-trained checkpoint: shift<1 pulls the grid toward sigma=0,
  # and shift=0.3 recovered ~60% of the Beta checkpoint's excess jerk (1.88x -> 1.62x).
  shift: 1.0

  # CRITICAL. SinusoidalPosEmb builds frequencies spanning 1.0 down to 1e-4, so a raw
  # sigma in [0,1] leaves roughly one of 128 embedding dimensions informative and the model
  # is close to blind to its own noise level. Scaling to [0,1000] matches what diffusers
  # feeds its own U-Nets. Do not lower this.
  timestep_scale: 1000.0

  # Optional smoothness term on the finite difference along the horizon axis. Off so the
  # first run is a pure swap; see docs/CLS-DP-variant-flow-matching.md section 4.
  temporal_consistency_weight: 0.0
  tc_space: velocity

  # Set by the action_space group. null under action_space=raw.
  action_autoencoder: ${action_latent.autoencoder}
  # Optional checkpoint path produced by Stage 2a autoencoder training.
  action_ae_ckpt: ${action_ae_ckpt}
