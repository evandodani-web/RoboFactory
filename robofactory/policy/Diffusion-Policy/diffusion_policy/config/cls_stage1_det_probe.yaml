# CLS-DP Stage 1, DETERMINISTIC + prior probe, distinct checkpoint prefix.
#
# Study DET (`cls_stage1_det.yaml`) now turns `enable_prior_probe` on by default, so this
# file is only a prefix alias: checkpoints land under `*_ctxdetprobe_*` instead of
# `*_ctxdet_*`. Prefer `cls_stage1_det` for new runs. Flip the probe with
# `enable_prior_probe=false` on either config.
#
# Launch with `--config-name=cls_stage1_det_probe.yaml`.
defaults:
  - cls_stage1_det
  - _self_

name: cls_stage1_det_probe

checkpoint_name: ${task_name}_ctxdetprobe${horizon_tag}_Agent${agent_id}_${data_num}
