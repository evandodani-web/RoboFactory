# CLS-DP Stage 1, Study B + 25-step privileged future.
#
# Same as cls_stage1.yaml with the horizon group swapped. Equivalent to
#   python train.py --config-name=cls_stage1.yaml horizon=h25
# Checkpoints land under *_ctxh25_*. Study B's h8 *_ctx_* priors are not reusable:
# time_embed is n_future_states long.
defaults:
  - cls_stage1
  - override /horizon: h25
  - _self_

name: cls_stage1_h25
