# CLS-DP Stage 2: train the latent-conditioned action-expert.
# One run per agent, after Stage 1. Launch with policy/Diffusion-Policy/train_cls_dp.sh
defaults:
  - _self_
  - task: cls_task

name: cls_dp
_target_: diffusion_policy.workspace.cls_robotworkspace.CLSRobotWorkspace

task_name: LiftBarrier-rf
agent_id: 0
n_agents: 2
data_num: 150
exp_name: "default"

stage: 2

checkpoint_name: ${task_name}_clsdp_Agent${agent_id}_${data_num}
# Frozen Stage 1 prior. Set by train_cls_dp.sh; leaving it null trains an untrained prior.
contextualizer_ckpt: null

shape_meta: ${task.shape_meta}

# Paper Table I. horizon/n_obs_steps/K already match the repo's DP defaults; with
# n_obs_steps=3 the executed slice action_pred[:, 2:10] yields 6 steps, which is the
# paper's "Execution steps: 6".
horizon: 8
n_obs_steps: 3
n_action_steps: 8
n_latency_steps: 0
n_future_states: 8
obs_as_global_cond: True
latent_dim: 256
feature_dim: 768

policy:
  _target_: diffusion_policy.policy.cls_diffusion_unet_image_policy.CLSDiffusionUnetImagePolicy

  shape_meta: ${shape_meta}

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small
    clip_sample: True
    prediction_type: epsilon

  # Standardized across all methods in the paper: ResNet-18 plus a lightweight MLP.
  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      weights: null
    resize_shape: null
    crop_shape: null
    random_crop: True
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

  # Must be architecturally identical to the Stage 1 prior_net or weight loading fails.
  prior_net:
    _target_: diffusion_policy.model.cls.prior_net.PriorNet
    feature_dim: ${feature_dim}
    latent_dim: ${latent_dim}
    d_model: 768
    n_layers: 2
    n_heads: 8
    dim_feedforward: 2048
    dropout: 0.0
    n_query: 1

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 100
  obs_as_global_cond: ${obs_as_global_cond}
  latent_dim: ${latent_dim}
  # Eq. 12 defines the deployed policy as a marginal over z, so sample rather than
  # taking the prior mean. Set false for lower-variance, more repeatable rollouts.
  latent_sample: True

  diffusion_step_embed_dim: 128
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True

  # z injection: down levels + bottleneck only, never the upsampling path.
  n_cond_tokens: 4
  cond_token_dim: 256
  cross_attn_heads: 4

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 32
  num_workers: 0
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 32
  num_workers: 0
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  # Study B: paper Table I / §V-A specify Adam. Study A used AdamW.
  _target_: torch.optim.Adam
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 100
  gradient_accumulate_every: 1
  use_ema: True
  freeze_encoder: False
  checkpoint_every: 25
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}_agent${agent_id}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
