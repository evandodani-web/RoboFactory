# CLS-DP Stage 2: train the latent-conditioned action-expert.
# One run per agent, after Stage 1. Launch with policy/Diffusion-Policy/train_cls_dp.sh
#
# Two axes are selectable as config groups, so they compose with every latent variant
# (cls_dp_det, cls_dp_fg, ...) instead of forcing a cross-product of config files:
#   sampler=ddpm|flow             which generative head denoises the action chunk
#   action_space=raw|latent       whether the head runs on joints or on a learned chunk latent
# Example: python train.py --config-name=cls_dp_det.yaml sampler=flow
defaults:
  - _self_
  - task: cls_task
  - sampler: ddpm
  - action_space: raw
  - horizon: h8

name: cls_dp
_target_: diffusion_policy.workspace.cls_robotworkspace.CLSRobotWorkspace

task_name: LiftBarrier-rf
agent_id: 0
n_agents: 2
data_num: 150
exp_name: "default"

stage: 2

# One tag per axis, so any combination names itself and no two runs collide:
#   latent_tag    cls_dp_det -> "det", cls_dp_fg -> "fg"
#   head_tag      sampler/flow -> "fm"
#   space_tag     action_space/latent -> "la"
#   horizon_tag   horizon/h25 -> "h25"
#   run_tag       free-form, CLI only; distinguishes re-runs of an identical composition
# All empty gives LiftBarrier-rf_clsdp_Agent0_150, unchanged from before the tags existed.
#
# run_tag exists because the axis tags describe the *configuration*, so retraining a study
# under changed defaults composes to the byte-identical name and overwrites the old result.
# Study FM is the case in point: today's flow defaults still compose to clsdpfm, so the
# re-run is `run_tag=v2` -> *_clsdpfmv2_* and the original 67% checkpoint survives.
latent_tag: ""
head_tag: ""
space_tag: ""
horizon_tag: ""
run_tag: ""
checkpoint_name: ${task_name}_clsdp${latent_tag}${head_tag}${space_tag}${horizon_tag}${run_tag}_Agent${agent_id}_${data_num}
# Frozen Stage 1 prior. Set by train_cls_dp.sh; leaving it null trains an untrained prior.
contextualizer_ckpt: null
# Frozen Stage 2a action autoencoder. Only read when action_space=latent.
action_ae_ckpt: null

shape_meta: ${task.shape_meta}

# n_obs_steps stays here; horizon / n_action_steps / n_future_states / n_exec_steps
# come from the `horizon` group. With n_obs_steps=3 the executed slice starts at
# window index 2 (time t).
n_obs_steps: 3
n_latency_steps: 0
obs_as_global_cond: True
latent_dim: 256
feature_dim: 768

policy:
  # _target_, noise_scheduler and num_inference_steps come from the `sampler` group.
  shape_meta: ${shape_meta}

  # Standardized across all methods in the paper: ResNet-18 plus a lightweight MLP.
  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      weights: null
    resize_shape: null
    crop_shape: null
    random_crop: True
    use_group_norm: True
    share_rgb_model: False
    imagenet_norm: True

  # Must be architecturally identical to the Stage 1 prior_net or weight loading fails.
  prior_net:
    _target_: diffusion_policy.model.cls.prior_net.PriorNet
    feature_dim: ${feature_dim}
    latent_dim: ${latent_dim}
    d_model: 768
    n_layers: 2
    n_heads: 8
    dim_feedforward: 2048
    dropout: 0.0
    n_query: 1

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  n_exec_steps: ${n_exec_steps}
  obs_as_global_cond: ${obs_as_global_cond}
  latent_dim: ${latent_dim}
  # Eq. 12 defines the deployed policy as a marginal over z, so sample rather than
  # taking the prior mean. Set false for lower-variance, more repeatable rollouts.
  latent_sample: True

  diffusion_step_embed_dim: 128
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True

  # z injection: down levels + bottleneck only, never the upsampling path.
  n_cond_tokens: 4
  cond_token_dim: 256
  cross_attn_heads: 4

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 32
  num_workers: 0
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 32
  num_workers: 0
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  # Study B: paper Table I / §V-A specify Adam. Study A used AdamW.
  _target_: torch.optim.Adam
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 100
  gradient_accumulate_every: 1
  use_ema: True
  freeze_encoder: False
  checkpoint_every: 25
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}_agent${agent_id}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
