[project]
name = "robofactory"
version = "0.0.0"
description = "RoboFactory: Exploring Embodied Agent Collaboration with Compositional Constraints"
readme = "README.md"
requires-python = ">=3.9,<3.10"
authors = [{ name = "RoboFactory contributors" }]
dependencies = [
    "mani_skill==3.0.0b12",
    "zarr==2.18.2",
    "hydra-core==1.3.2",
    "dill==0.3.9",
    "einops==0.8.1",
    "diffusers==0.32.2",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "pandas==2.2.3",
    "numba==0.60.0",
    # CLS-DP: frozen SigLIP encoders for the contextualizer.
    # sentencepiece and protobuf are required by SiglipTokenizer; transformers does not pull them in.
    "transformers==4.49.0",
    "sentencepiece==0.2.2",
    "protobuf>=4.25,<6",
    # SAPIEN still imports pkg_resources; setuptools 82 removed it.
    "setuptools>=70,<81",
]

[project.urls]
Homepage = "https://github.com/MARS-EAI/RoboFactory"

[build-system]
requires = ["setuptools>=70,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["robofactory*"]

# Application env: install the pinned deps, do not also pip-install this repo.
# setup.py remains the original packaging entry point.
[tool.uv]
package = false
python-preference = "only-managed"
